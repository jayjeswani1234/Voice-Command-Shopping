services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - COMMAND_SERVICE_URL=http://command-service:3001
      - SHOPPING_SERVICE_URL=http://shopping-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3004
    depends_on:
      - command-service
      - shopping-service
      - product-service
      - recommendation-service

  command-service:
    build: ./services/command-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - KAFKA_BROKER=kafka:9092
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
    depends_on:
      - kafka

  shopping-service:
    build: ./services/shopping-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://mongo:27017/shopping
    depends_on:
      - kafka
      - mongo

  product-service:
    build: ./services/product-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo:27017/products
    depends_on:
      - mongo

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://mongo:27017/recommendations
      - REDIS_URL=redis://redis:6379
    depends_on:
      - kafka
      - mongo
      - redis

volumes:
  mongo_data:
